name: Dune Part 3 Booking Checker

on:
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test Telegram message"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dune-checker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Check District
        run: python check_dune.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHECK_URLS: ${{ vars.CHECK_URLS }}
          TEST_MODE: ${{ inputs.test }}
